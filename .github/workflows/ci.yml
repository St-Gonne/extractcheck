name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.13"
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install optional reading-mode demo
        run: python -m pip install ".[demo]"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Synthetic proof
        run: python -m extractcheck.cli synthetic --output .ci-synthetic-output
      - name: Reference comparison
        run: python -m extractcheck.cli compare --output .ci-comparison-output
      - name: Public candidate audit
        run: |
          git archive --format=tar --output=.ci-release.tar HEAD
          python -m tarfile -e .ci-release.tar .ci-release
          python tools/audit_release.py --release --root .ci-release
      - name: Compile
        run: python -m compileall -q src tests tools
